<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    body {
      background-color: #f8f9fa; /* Light gray background */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .dashboard-header {
      background-color: #343a40; /* Dark header */
      color: white;
      padding: 1rem 1.5rem;
      margin-bottom: 2rem;
      border-bottom: 5px solid #0d6efd; /* Primary color accent */
    }
    .dashboard-header h1 {
      margin-bottom: 0;
      font-size: 1.75rem;
    }
    .dashboard-nav a {
      color: #adb5bd; /* Lighter text for nav links */
      margin-left: 15px;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .dashboard-nav a:hover, .dashboard-nav a.active {
      color: white;
      text-decoration: underline;
    }
    .card-custom {
      border: none;
      border-radius: 0.5rem;
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
      transition: transform 0.2s ease-in-out;
    }
    .card-custom:hover {
      transform: translateY(-5px);
    }
    .card-custom .card-header {
      border-top-left-radius: 0.5rem;
      border-top-right-radius: 0.5rem;
      font-weight: bold;
    }
    .card-custom .card-title {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }
    .card-custom .card-text.count {
      font-size: 1.5rem;
      font-weight: bold;
      color: #0d6efd; /* Primary color for count */
    }
    .card-custom .btn {
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
    }
    .footer-custom {
      text-align: center;
      padding: 1.5rem 0;
      margin-top: 3rem;
      background-color: #e9ecef;
      color: #6c757d;
      font-size: 0.85rem;
      border-top: 1px solid #dee2e6;
    }
  </style>
</head>
<body>

<header class="dashboard-header d-flex justify-content-between align-items-center">
  <h1><i class="fas fa-tachometer-alt me-2"></i>Admin Dashboard</h1>
  <nav class="dashboard-nav">
    <a href="#" class="active">Dashboard</a>
    <a th:href="@{/admin/management/recruiters}">Recruiters</a>
    <a th:href="@{/admin/management/candidates}">Candidates</a>
  </nav>
</header>

<main class="container"> <div th:replace="${content}"> </div> </main>

<footer class="footer-custom">
  <p class="mb-1">&copy; <span th:text="${#dates.year(#dates.createNow())}">2025</span> Your Recruitment Company. All Rights Reserved.</p>
  <p class="mb-0">Powered by Your Platform</p>
</footer>




</body>
</html>
