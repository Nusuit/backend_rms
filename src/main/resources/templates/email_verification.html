<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Email Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .content {
            font-size: 16px;
            line-height: 1.6;
        }
        .otp {
            font-size: 30px;
            font-weight: bold;
            color: #ff5733;
            margin: 20px 0;
            background-color: #F0F2F1;
            text-align: center;
            letter-spacing: 7px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 20px;
        }

        #image {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Email Confirmation</h2>
    </div>

    <div class="content">
        <p>Hello <span th:text="${to}">User</span>,</p>
        <p>We received a request to confirm your email address. To complete the process, please enter the OTP below:</p>

        <div class="otp" th:text="${otp}">123456</div>

        <p>This OTP is valid for <b>5 minutes</b>. If you did not request this confirmation, please ignore this email.</p>
    </div>

    <div class="footer">
       
    </div>
</div>

</body>
</html>
